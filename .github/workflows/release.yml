name: Release preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New preview release tag
        required: true
        default: v0.1.0-preview.2
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema tooling
        run: python -m pip install protobuf==6.33.6
      - name: Prepare pinned vcpkg
        run: |
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch origin 00807e89724847a866033a2f042c38fafae3c534 --depth 1
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg fetch failed' }
          git -C "$env:VCPKG_INSTALLATION_ROOT" checkout --detach 00807e89724847a866033a2f042c38fafae3c534
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg checkout failed' }
          & "$env:VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: windows-2022-vcpkg-${{ hashFiles('vcpkg.json') }}
      - name: Build
        run: |
          . ./tools/dev_shell.ps1
          cmake --preset windows "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build --preset release --target chronicles-login-server --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
      - name: Verify executable startup
        run: |
          & ./out/build/windows/bin/Release/chronicles-login-server.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Executable startup failed' }
      - name: Verify native realm protocol identity
        run: python tests/verify_realm_protocol.py
      - name: Package redistributable files
        run: ./tools/package_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: login-server-win64
          path: |
            out/release/*.zip
            out/release/*.sha256
          if-no-files-found: error
      - name: Create draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$') {
              throw 'Use a new vMAJOR.MINOR.PATCH-preview.NUMBER tag.'
          }
          $files = Get-ChildItem out/release -File | Select-Object -ExpandProperty FullName
          gh release create $env:RELEASE_TAG @files --target $env:GITHUB_SHA --draft --prerelease --title "Project Chronicles login-server $env:RELEASE_TAG" --notes 'Initial experimental preview. No gameplay changes in this publication. Supply your own compatible client files; none are included. See the repository README for setup.'
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
